<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зимняя разминка · ЕГЭ по русскому, задания 9–11</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#eaf5ff;--bg2:#c3dff8;--card:rgba(255,255,255,.74);--bd:rgba(70,130,195,.3);--tx:#0f2747;--mut:#4d6a8d;--ac:#2a78d0;--ac2:#6cc0f5;--onac:#fff;--ok:#12805a;--bad:#c92f40;--flake:#8dbbe8;--inp:rgba(255,255,255,.95);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#07112a;--bg2:#15386a;--card:rgba(255,255,255,.07);--bd:rgba(160,210,255,.22);--tx:#eaf4ff;--mut:#9db9d8;--ac:#8fd3ff;--ac2:#4aa3ea;--onac:#07112a;--ok:#5fe0a2;--bad:#ff7b88;--flake:#fff;--inp:rgba(255,255,255,.09)}}
:root[data-theme="dark"]{--bg1:#07112a;--bg2:#15386a;--card:rgba(255,255,255,.07);--bd:rgba(160,210,255,.22);--tx:#eaf4ff;--mut:#9db9d8;--ac:#8fd3ff;--ac2:#4aa3ea;--onac:#07112a;--ok:#5fe0a2;--bad:#ff7b88;--flake:#fff;--inp:rgba(255,255,255,.09)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font:400 1.05rem/1.55 Manrope,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--tx);background:var(--bg1) linear-gradient(165deg,var(--bg1),var(--bg2)) fixed}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:28px 16px 56px}
.hero{text-align:center;padding:30px 8px 18px}
.hero .fl{font-size:3.2rem;line-height:1;display:inline-block;color:var(--ac);animation:sp 18s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font:800 clamp(2rem,7vw,3.3rem)/1.08 "Playfair Display",Georgia,serif;margin:.3em 0 .25em;letter-spacing:-.01em}
.hero p{margin:0 auto;max-width:34em;color:var(--mut)}
.tabs{display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap}
.tab{flex:1 1 150px;font:inherit;font-weight:600;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:left}
.tab small{display:block;color:var(--mut);font-weight:400;font-size:.85rem}
.tab[aria-selected=true]{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.tab[aria-selected=true] small{color:inherit;opacity:.85}
.tab:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px 18px 14px;margin:0 0 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px -18px rgba(20,60,120,.5)}
.card.hide{display:none}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:1.05rem}
.hd b{font-family:"Playfair Display",Georgia,serif;font-size:1.25rem}
.v{font-weight:800;font-size:.95rem;text-align:right}
.good .v{color:var(--ok)}.bad .v{color:var(--bad)}
.q{margin:.3em 0 .7em;color:var(--mut);font-size:.92rem}
.row{display:flex;gap:12px;align-items:flex-start;padding:7px 4px;border-radius:12px}
.chip{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--ac2);background:transparent;color:var(--tx);font:inherit;font-weight:800;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.chip.k{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.w{background:var(--bad);border-color:var(--bad);color:#fff}
.chip:disabled{cursor:default}
.w{padding-top:3px;line-height:2.1}
.g{width:1.45em;height:1.75em;margin:0 2px;padding:0;text-align:center;font:800 1.1rem Manrope,sans-serif;color:var(--ac);background:var(--inp);border:0;border-bottom:2px solid var(--ac2);border-radius:7px 7px 0 0}
.g:focus{outline:0;box-shadow:0 0 0 3px rgba(108,192,245,.4)}
.g.ok{border-color:var(--ok);color:var(--ok)}
.g.no{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
sup{color:var(--ok);font-weight:800;margin-left:1px}
.ans{margin-top:6px;color:var(--mut);font-size:.92rem}.ans b{color:var(--tx);letter-spacing:.12em}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 24px;background:var(--ac);color:var(--onac);cursor:pointer}
.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
#res{display:none;text-align:center;padding:22px;margin-bottom:16px}
#res .big{font:800 3rem/1 "Playfair Display",Georgia,serif;color:var(--ac)}
#res p{margin:.4em 0;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.hero .fl{animation:none}}
@media (max-width:520px){.card{padding:14px 12px 10px}.row{gap:8px}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
<header class="hero">
<span class="fl" aria-hidden="true">❄</span>
<h1>Зимняя разминка</h1>
<p>ЕГЭ по русскому языку, задания 9–11. Вставьте пропущенные буквы, затем отметьте номера рядов, где во всех словах пропущена одна и та же буква.</p>
</header>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="tasks"></div>
<div id="res" class="card" role="status"></div>
<div class="bar"><button class="btn" id="fin" type="button">Завершить и проверить</button><button class="btn s" id="again" type="button" style="display:none">Пройти заново</button></div>
</main>
<script>
const D=[
["345","к{а}ртон, обог{а}щение, благосл{о}вение","п{е}риод, скр{и}петь (на морозе), (ударился) оз{е}мь","оф{и}цер, поч{и}татель, прокл{и}нать","б{а}хрома, оз{а}рённый, нак{а}лить (докрасна)","экстр{е}мальный, соч{е}тание, раст{е}рзать"],
["14","ав{а}нгард, ав{а}нтюра, акв{а}рельный","амн{и}стировать, ап{е}лляция, б{е}рлога","асф{а}льтированный, б{а}зироваться, д{о}лина","безотл{а}гательный, г{а}лерея, возр{а}стание","ш{ё|е}лковый, ш{о}рты, деш{ё|е}вый"],
["124","заг{о}релый, непром{о}каемый, к{о}мендант","оп{и}раться, см{и}нать (траву), поч{и}татель (таланта)","укр{о}титель (тигров), благосл{о}вить, симп{а}тичный","посв{я}щение (другу), недос{я}гаемый, у{я}звить","бл{е}стеть, с{е}дина (в волосах), прим{и}рять (поссорившихся)"],
["23","сод{е}ржимое, разж{и}мать, соч{е}таемость","подн{и}мая (тяжести), зап{и}рать (дверь), поч{и}тать (старших)","переск{о}чить, запр{о}сить (документы), прил{о}жение","заг{о}релись (глаза), прир{а}щение, водор{о}сли","возвр{а}щает (долги), оз{а}рение, к{о}сые (лучи солнца)"],
["14","к{а}нонада, сп{а}ртакиада, обог{а}щение","параш{ю}т, прищ{у}рить (глаза), поч{у}ять (неладное)","р{е}цензия, ст{и}пендия, ф{и}олетовый","оп{о}здание, подск{о}чить, пл{о}вчиха","м{е}нталитет, (ночное) прив{и}дение, пол{е}нившийся (доделать работу)"],
["23","анн{о}тация, обм{а}кнуть (перо в чернила), обор{о}няться","к{о}ллекционный, укр{о}щать (хищника), приг{о}ревший","вакц{и}на, аукц{и}он, ц{и}ркуль","(сильное) исп{а}рение, преод{о}леть, вск{о}чить","пл{о}вец, предл{а}гать, оз{о}рной (ребёнок)"],
["14","д{о}лжник, к{о}снулся, пр{о}стоватый","пот{е}рять (перчатку), зам{и}рать (от удивления), выт{е}рли","зан{и}мательный, зас{е}литься (в гостиницу), проб{и}раться","пок{о}рять, р{о}стовщик, обг{о}ревший","сл{о}жение (чисел), ч{а}совщик, ск{а}кать"],
["124","ув{я}дание (цветов), землетр{я}сение, об{я}зательно","исп{о}лнение, в{о}рсистый, прекл{о}нение","тр{е}нажёр, ед{и}номышленник, пот{е}рять","ст{и}листический, зан{и}маться, ч{и}стоплотный","г{е}роизм, зап{и}вал (водой), л{е}бединый"],
["24","инж{е}нер, обд{и}рать (прутик), поч{и}тать (старость)","хл{о}потливое (дело), дек{о}ративный, иск{о}са (посмотреть)","беспанц{и}рный, ц{и}линдр, ц{ы}ганский","к{о}рмовые (овощи), зар{о}сли (бамбука), фи{о}летовый","экспер{и}мент, зам{и}нать (угол), (сделать) ч{е}ртёж"],
["23","ауд{и}енция, пр{е}зидент, пр{и}вет","т{а}релка, к{а}ндидат, к{а}лач","отв{о}рять (ворота), подг{о}ревший, ог{о}рчаться","об{о}няние, од{о}левать (неприятеля), ув{а}жение","поч{и}нить, ст{е}ллаж, выл{е}чить (больного)"],
["234","р{а|о}ссыпной, пр{а}славянский (язык), пр{о}видец","пр{е}образиться, пр{е}емственность, пр{е}имущественный","многооб{ъ}ектный, (ржавчина) раз{ъ}ела, макрос{ъ}ёмка","не{с}быточный, бе{с}системность, в{с}карабкаться","под{ы}скивать, дез{и}нфектор, от{ы}грываться"],
["23|32","пр{и}обрёл, пр{е}образователь, беспр{е}станно (лил дождь)","п{о}дсказывать, п{о}никнуть, д{о}ехать","п{ь}едестал, ал{ь}тернатива, б{ь}ются","и{з}древле, не{с}держанный, не{с}добровать","оп{о}знание, нер{а}створимый, п{о}йдём"],
["124","пр{и}карманить, пр{и}терпеться (к боли), пр{и}уныл","пре{д}писанное, на{д}кусил, по{д}править","не{с}держанный, и{з}бежать, во{с}препятствовать","не{о}глядный, от{о}бравший, запр{о}кинуть","в{ь}юнок, меж{ъ}ярусный, ад{ъ}ютант"],
["35","обе{з}доленный, не{с}гибаемый, и{з}древле","вз{ы}скать, пост{и}ндустриальный, без{ы}нвентарный","пр{е}старелый, непр{е}одолимый, пр{е}даться (мечтаниям)","фотооб{ъ}ектив, зав{ь}южило, р{ь}яный","под{о}звать, с{о}звучие, перев{о}плотиться"],
["14|41","пр{и}общиться, пр{и}школьный, пр{и}встать","вз{о}браться, п{о}забавить, р{а}ссказ","ни{з}вергать, и{с}черпать, в{з}дрогнуть","об{ъ}явить, с{ъ}ёмка, суб{ъ}ект","от{о}всюду, нар{а}спашку, п{о}дсветка"],
["13","пре{д}писание, на{д}кусить, по{д}править","бе{с}компромиссный, во{з}росший, не{с}держанный","пр{и}брежный, пр{и}терпеться (к боли), пр{и}уныть","под{о}брать, нез{а}вершённая (работа), п{о}немногу","в{ь}юнок, меж{ъ}ярусный, ад{ъ}ютант"],
["24","пр{е}вентивная (мера), пр{и}даное, пр{е}следовать (зверя)","пред{ъ}юбилейный, суб{ъ}ективный, супер{ъ}яхта","в{з}дыбиться, не{с}говорчивый, {з}дравствуйте","вз{и}мать (штраф), транс{и}ранский, контр{и}гра","пр{а}славянский (язык), пр{а}родина, пр{о}образ (героя)"],
["245","по{д}метить, на{д}ломленный, о{т}дежурить","транс{ъ}европейский, об{ъ}ектив (камеры), двух{ъ}ярусный","бе{з}земельный, и{с}портить, ни{с}посланный","пр{и}горелый, пр{и}обрести, пр{и}открытый","из{ы}сканный, от{ы}грывать, пред{ы}дущий"],
["24|42","бе{з}голосый, чере{с}чур, во{с}пламенеть","д{ь}ячок, кар{ь}ера, п{ь}едестал","не{о}писуемый, поз{а}прошлый, п{о}рядок","непр{и}миримый, пр{и}близить, пр{и}звание","от{о}мстить, перер{а}спределение, р{а}сстрел"],
["14|41","расп{о}ложить, с{о}поставление, пр{о}думать (всё до мелочей)","пр{и}спосабливающийся, непр{е}одолимый, пр{и}мкнувший","бе{с}пробудный, и{с}коренить, в{з}дремнуть","с{ы}змала, с{ы}митировать, об{ы}ск","о{т}брасывать, на{д}пись, по{д}черкнуть"],
["145","глянц{е}витый, рубаш{е}чная (ткань)","мешоч{е}к, метел{и}ца","просвеч{и}вать, противокашл{е}вый (препарат)","еж{о}вый, грош{о}вый","милост{и}вый, обезвож{и}вание (организма)"],
["14","накапл{и}вать, улыбч{и}вый","податл{и}вый, нул{е}вой","се{я}вший, перекле{и}вать","обезвод{е}ла (река), потч{е}вать","выздоров{е}ть, смекал{и}стый"],
["24","ноздр{е}ватый, расплывч{а}тый","завед{о}вал, руч{о}нка","обустра{и}ваться, горош{е}к","фасол{е}вый, затм{е}вать","исслед{о}вать, раздум{ы}вать"],
["125","горош{и}нка, масл{и}це","передёрг{и}вая, заносч{и}вый","подчёрк{и}вать, (новый) владел{е}ц","яблон{е}вый, плать{и}це","француз{с}кий, англо-рус{с}кий"],
["135","заботл{и}вый, развал{и}ны (дворца)","продл{е}вать, обезоруж{и}вающий","дымч{а}тый (кот), сначал{а}","карандаш{и}к, рыж{е}ватый","разнос{ч}ик, видеодат{ч}ик"],
["23|32","отта{я}в, ореш{е}к","вкрадч{и}вый, меньш{и}нство","запрыг{и}вать, движ{и}мый","алюмини{е}вый, пород{и}стый","задумч{и}вый, гир{е}вой (спорт)"],
["235","навязч{и}вый, екатеринбурж{е}нка","нищ{е}нский, (чайное) сит{е}чко","коч{е}вой, потч{е}вать","вермишел{е}вый, масл{я}нистый","бельч{о}нок, пастуш{о}нок"],
["135","ноч{ё|е}вка, реш{ё|е}нный","кресл{и}це, мудр{е}цы","насмешл{и}вый, милост{и}вый","эмал{е}вый, наста{и}вал","одол{е}вать, стар{е}нький"],
["24|42","усидч{и}вость, текуч{е}сть","пут{е}во́й, зор{е}нька","налаж{и}вать, син{е}ватый","отпуг{и}вая, шалаш{и}к","расклан{я}вшийся, крив{и}зна"],
["124","заступнич{е}ство, (хлеб) заплесн{е}вел","гречн{е}вый, недоум{е}вать","атак{о}вать, протанц{е}вав","гуттаперч{е}вый, олед{е}нелый","родо-плем{е}нной (строй), шерст{я}ной (свитер)"]
];
const TABS=[["Задание 9","Корни"],["Задание 10","Приставки"],["Задание 11","Суффиксы"]];
const sel=D.map(()=>new Set());let tab=0,done=false,errOnly=false;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
D.forEach((d,i)=>{
  const c=document.createElement('section');c.className='card';c.dataset.i=i;
  let h=`<div class="hd"><b>Задание ${9+(i/10|0)} · №${i%10+1}</b><span class="v"></span></div><p class="q">Укажите варианты ответов, в которых ${i>=20?'в обоих словах':'во всех словах'} одного ряда пропущена одна и та же буква. Запишите номера ответов.</p>`;
  d.slice(1).forEach((r,j)=>{
    h+=`<div class="row"><button type="button" class="chip" data-i="${i}" data-j="${j+1}" aria-pressed="false" aria-label="Ряд ${j+1}">${j+1}</button><div class="w">${r.replace(/\{([^}]+)\}/g,(m,a)=>`<input class="g" maxlength="1" data-a="${a}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="пропущенная буква">`)}</div></div>`;
  });
  c.innerHTML=h+'<div class="ans">Ваш ответ: <b>—</b></div>';
  $('#tasks').appendChild(c);
});
TABS.forEach((t,k)=>{
  const b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('role','tab');b.dataset.k=k;
  b.onclick=()=>{tab=k;errOnly=false;show();scrollTo({top:$('#tabs').offsetTop-10,behavior:'smooth'})};
  $('#tabs').appendChild(b);
});
function show(){
  $$('.card[data-i]').forEach(c=>c.classList.toggle('hide',errOnly?!c.classList.contains('bad'):(c.dataset.i/10|0)!==tab));
  $$('.tab').forEach(b=>{
    const k=+b.dataset.k;let n=0;for(let i=k*10;i<k*10+10;i++)if(sel[i].size)n++;
    b.setAttribute('aria-selected',k===tab&&!errOnly);
    b.innerHTML=`${TABS[k][0]}: ${TABS[k][1].toLowerCase()}<small>${done?(b.dataset.sc||''):'отвечено '+n+' из 10'}</small>`;
  });
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b||done)return;
  const i=+b.dataset.i,j=b.dataset.j,s=sel[i];
  s.has(j)?s.delete(j):s.add(j);
  b.classList.toggle('on',s.has(j));b.setAttribute('aria-pressed',s.has(j));
  b.closest('.card').querySelector('.ans b').textContent=s.size?[...s].sort().join(''):'—';
  show();
});
document.addEventListener('input',e=>{
  const g=e.target;if(!g.classList.contains('g'))return;
  g.value=g.value.toLowerCase();
  if(g.value){const all=$$('.g');const n=all[all.indexOf(g)+1];if(n&&n.closest('.card')===g.closest('.card'))n.focus()}
});
$('#fin').onclick=()=>{
  if(done)return;done=true;
  const sc=[0,0,0];let lt=0,lg=0;
  $$('.card[data-i]').forEach(c=>{
    const i=+c.dataset.i,key=D[i][0].split('|')[0],ks=new Set(key),t=i/10|0;
    const ok=ks.size===sel[i].size&&[...ks].every(x=>sel[i].has(x));
    if(ok)sc[t]++;
    c.classList.add(ok?'good':'bad');
    c.querySelector('.v').textContent=ok?'✓ Верно':'✗ Ваш ответ: '+([...sel[i]].sort().join('')||'—')+' · верный: '+key;
    c.querySelectorAll('.chip').forEach(b=>{const k=ks.has(b.dataset.j);b.classList.toggle('k',k);b.classList.toggle('w',sel[i].has(b.dataset.j)&&!k);b.disabled=true});
    c.querySelectorAll('.g').forEach(g=>{
      const acc=g.dataset.a.split('|'),good=acc.includes(g.value.trim().toLowerCase());
      lg++;if(good)lt++;
      g.classList.add(good?'ok':'no');g.readOnly=true;
      if(!good)g.insertAdjacentHTML('afterend','<sup>'+acc[0]+'</sup>');
    });
  });
  const tot=sc[0]+sc[1]+sc[2],wr=$$('.card.bad').map(c=>+c.dataset.i);
  $$('.tab').forEach(b=>b.dataset.sc=sc[b.dataset.k]+' из 10');
  const msg=tot>=27?'Снежная королева орфографии!':tot>=21?'Отличный результат — сугроб покорён.':tot>=14?'Хорошо, но есть над чем поработать.':'Хорошая тренировка. Разберите ошибки и попробуйте снова.';
  const r=$('#res');
  r.style.display='block';
  r.innerHTML=`<div class="big">${tot} из 30</div><p>${msg}</p><p>Задание 9: ${sc[0]}/10 · Задание 10: ${sc[1]}/10 · Задание 11: ${sc[2]}/10</p><p>Букв вставлено верно: ${lt} из ${lg}</p><p><b>Задания с ошибками:</b> ${wr.length?wr.map(i=>`<button type="button" class="btn s go" style="padding:6px 12px;margin:2px" data-i="${i}">${9+(i/10|0)}·${i%10+1}</button>`).join(' '):'нет, всё верно!'}</p><div class="bar" style="justify-content:center"><button type="button" class="btn" id="onlyErr">Смотреть только ошибки</button><button type="button" class="btn s" id="allT">Все задания по вкладкам</button></div>`;
  const go=i=>{const c=$('.card[data-i="'+i+'"]');c&&c.scrollIntoView({behavior:'smooth',block:'center'})};
  r.querySelectorAll('.go').forEach(b=>b.onclick=()=>{errOnly=true;show();go(b.dataset.i)});
  $('#onlyErr').onclick=()=>{errOnly=true;show();wr.length&&go(wr[0])};
  $('#allT').onclick=()=>{errOnly=false;show();scrollTo({top:$('#tabs').offsetTop-10,behavior:'smooth'})};
  $('#fin').style.display='none';$('#again').style.display='';
  show();r.scrollIntoView({behavior:'smooth',block:'start'});
};
$('#again').onclick=()=>location.reload();
show();
(function(){
  const c=$('#snow'),x=c.getContext('2d');let W,H;
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
  const f=Array.from({length:Math.min(90,innerWidth/11|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.4+.7,s:Math.random()*.7+.25,p:Math.random()*6.28}));
  let col='#fff';
  function draw(){
    x.clearRect(0,0,W,H);x.fillStyle=col;
    f.forEach(o=>{x.globalAlpha=.35+o.r/4;x.beginPath();x.arc(o.x,o.y,o.r,0,6.283);x.fill()});
  }
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){col=getComputedStyle(document.documentElement).getPropertyValue('--flake');draw();return}
  let t=0;
  (function loop(){
    if(t++%60===0)col=getComputedStyle(document.documentElement).getPropertyValue('--flake')||'#fff';
    f.forEach(o=>{o.y+=o.s;o.p+=.012;o.x+=Math.sin(o.p)*.35;if(o.y>H+5){o.y=-5;o.x=Math.random()*W}});
    draw();requestAnimationFrame(loop);
  })();
})();
</script>
